name: Windows build and non-mutating regressions
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build x64 and run fake-backend regressions
        shell: powershell
        run: .\Build.ps1 -Test -Version "0.0.0-ci.${{ github.run_number }}+${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinTraceForge-x64
          path: |
            build/wtf.exe
            build/WinTraceForge.Native.dll
